<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos | Secret Sweet Maid</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="row">

    <header class="col-2">
      <nav class="menu-principal">
        <h1 class="logo-nombre">Secret Sweet Maid</h1>
        <ul class="menu-lista">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="productos.html" class="activo">Productos</a></li>
          <li><a href="carrito.html">Carrito <span id="contador-carrito" class="contador-carrito">0</span></a></li>
          <li><a href="login.html">Iniciar sesión</a></li>
          <li><a href="registro.html">Registrarme</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </header>

    <main class="col-10 contenido-principal">
      <section id="catalogo">
        <h2>Nuestros productos</h2>

        <!-- Filtro por categoría: dispara renderizarProductos() en productos.js -->
        <div class="filtros">
          <label for="filtro-categoria"><strong>Filtrar por categoría:</strong></label>
          <select id="filtro-categoria">
            <option value="todas">Todas</option>
            <option value="accesorios">Accesorios</option>
            <option value="vestuario">Vestuario</option>
            <option value="coleccionables">Coleccionables</option>
          </select>
        </div>

        <!-- Este contenedor lo llena productos.js con JS, leyendo
             el arreglo "productos" (no hay una sola tarjeta escrita
             a mano acá en el HTML). -->
        <div class="row" id="lista-productos"></div>
      </section>

      <footer>
        <p>Secret Sweet Maid &copy; 2026 · <a href="contacto.html">Contáctanos</a></p>
      </footer>
    </main>
  </div>

  <script src="js/main.js"></script>
  <script src="js/productos.js"></script>
</body>
</html>
