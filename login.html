<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Secret Sweet Maid</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="row">

    <header class="col-2">
      <nav class="menu-principal">
        <h1 class="logo-nombre">Secret Sweet Maid</h1>
        <ul class="menu-lista">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="productos.html">Productos</a></li>
          <li><a href="carrito.html">Carrito <span id="contador-carrito" class="contador-carrito">0</span></a></li>
          <li><a href="login.html" class="activo">Iniciar sesión</a></li>
          <li><a href="registro.html">Registrarme</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </header>

    <main class="col-10 contenido-principal">
      <section id="login">
        <h2>Iniciar sesión</h2>

        <!-- Mensaje general de éxito/error, lo llena validaciones.js -->
        <p id="mensaje-login" class="mensaje-formulario" style="display:none;"></p>

        <!-- novalidate: apagamos la validación nativa del navegador
             porque la validación la hacemos NOSOTRAS con JS (así
             podemos mostrar mensajes personalizados, como pide la pauta) -->
        <form id="form-login" class="form-tienda" novalidate>

          <!-- Cada <label for="..."> está asociado a su <input id="...">:
               esto es justo lo que la pauta llama "etiquetas asociadas". -->
          <div class="campo">
            <label for="login-correo">Correo electrónico</label>
            <input type="email" id="login-correo" name="correo"
                   autocomplete="email" maxlength="100"
                   placeholder="nombre@duoc.cl">
            <span id="error-login-correo" class="mensaje-error"></span>
          </div>

          <div class="campo">
            <label for="login-clave">Contraseña</label>
            <input type="password" id="login-clave" name="clave"
                   autocomplete="current-password" maxlength="10">
            <span id="error-login-clave" class="mensaje-error"></span>
          </div>

          <button type="submit" class="btn-enviar">Ingresar</button>
        </form>

        <p style="margin-top:15px;">
          ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>.
        </p>
      </section>

      <footer>
        <p>Secret Sweet Maid &copy; 2026 · <a href="contacto.html">Contáctanos</a></p>
      </footer>
    </main>
  </div>

  <script src="js/main.js"></script>
  <script src="js/validaciones.js"></script>
  <script>
    // Truco simple: cuando validaciones.js pone texto en el mensaje,
    // este mismo script lo hace visible (estaba display:none al cargar
    // para no mostrar un cuadro vacío antes de intentar enviar).
    document.getElementById("form-login").addEventListener("submit", () => {
      document.getElementById("mensaje-login").style.display = "block";
    });
  </script>
</body>
</html>
